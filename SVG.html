<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG</title>
</head>
<body>
    <SVG height="500" width="500">
      
        <circle cx="250" cy="250" r="150" stroke="blue" stroke-width="2" fill="cyan"/>
        <rect x="0" y="0" height="100" width="100" stroke="green" fill="white" stroke-width="2px"></rect>
          <line x1="0" x2="100" y2="100" y1="0"  stroke="blue"/>
        <line x1="0" x2="100" y1="0" y2="0" stroke="blue" stroke-width="2px"/>
        <line x1="100" x2="100" y1="0" y2="100" stroke="blue" />
        <text x="200" y="200" fill="blue" font-size="20px" font-family="verdana">LJU</text>
        <polygon points="100,10,40,198,190,78,10,78,160,198" stroke="white" fill="cyan" fill-rule="nonzero"></polygon>
    </SVG>
</body>
</html>
